    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">

          "name": "GymGurus",

          "description": "AI fitness platform for personal trainers and solo athletes. Manage clients, build programs, track PRs.",
          "offers": {
            "@type": "AggregateOffer",
            "lowPrice": "0",
            "highPrice": "99",
            "priceCurrency": "USD",
            "offerCount": "5"
          },
          "featureList": [
            "AI Workout Generation",
            "Client Management",
            "Progress Tracking",
            "Strength Standards",
            "Body Metrics",
            "Nutrition Planning",
            "13 Free Fitness Calculators",
            "Multi-Week Program Builder"
          ]
        },
        {
          "@type": "Organization",
          "name": "GymGurus",
          "url": "https://gym-gurus-production.up.railway.app"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Does GymGurus replace my spreadsheets?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. GymGurus replaces spreadsheets, Google Docs, and paper logs with a purpose-built platform for managing clients, workouts, progress, and payments in one place." }
            },
            {
              "@type": "Question",
              "name": "Can my clients see their own progress?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. Clients (Disciples) get their own login with a dashboard showing assigned workouts, progress charts, and upcoming sessions." }
            },
            {
              "@type": "Question",
              "name": "Is there a free tier?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. GymGurus offers a 30-day free trial with full access. No credit card required to start." }
            },
            {
              "@type": "Question",
              "name": "How does AI workout generation work?",
              "acceptedAnswer": { "@type": "Answer", "text": "Tell the AI your goal, experience level, equipment, and time. It generates a complete workout with exercises, sets, reps, and rest periods in under 30 seconds." }
            },
            {
              "@type": "Question",
              "name": "Can I build multi-week training programs?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. The Program Builder lets you create periodized multi-week programs with progressive overload, deload weeks, and day-by-day structure. AI can generate entire programs too." }
            }
          ]
        },
        {
          "@type": "WebSite",
          "name": "GymGurus",
          "url": "https://gym-gurus-production.up.railway.app",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://gym-gurus-production.up.railway.app/calculators?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- CSP nonce exposed for client-side components (e.g. chart.tsx style injection).
         The placeholder is replaced server-side with the per-request nonce. -->
    <meta name="csp-nonce" content="{{NONCE}}" />

    <!-- Blocking role-class script: runs synchronously before React hydrates.
         Reads last-known role from localStorage and applies the CSS class to
         <html> immediately, eliminating the role colour flash on load (§ UX-3).
         'gg_role' is written by AuthGuard.tsx on auth success, cleared on logout. -->
    <script nonce="{{NONCE}}">
      (function () {
        try {
          var role = localStorage.getItem('gg_role');
          if (role) {
            var map = { trainer: 'role-guru', solo: 'role-ronin', client: 'role-disciple' };
            var cls = map[role];
            if (cls) document.documentElement.classList.add(cls);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
