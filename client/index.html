            },
            {
              "@type": "Question",

  </head>
  <body>
    <!-- CSP nonce exposed for client-side components (e.g. chart.tsx style injection).
         The placeholder is replaced server-side with the per-request nonce. -->
    <meta name="csp-nonce" content="{{NONCE}}" />

    <!-- Blocking role-class script: runs synchronously before React hydrates.
         Reads last-known role from localStorage and applies the CSS class to
         <html> immediately, eliminating the role colour flash on load (§ UX-3).
         'gg_role' is written by AuthGuard.tsx on auth success, cleared on logout. -->
    <script nonce="{{NONCE}}">
      (function () {
        try {
          var role = localStorage.getItem('gg_role');
          if (role) {
            var map = { trainer: 'role-guru', solo: 'role-ronin', client: 'role-disciple' };
            var cls = map[role];
            if (cls) document.documentElement.classList.add(cls);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
